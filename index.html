<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Hydra Trader — Live Dashboard</title>
    <style>
        :root {
            --bg: #0e1116;
            --bg-panel: #131820;
            --bg-chart: #0e1116;
            --border: #1f2630;
            --text: #dddddd;
            --soft: #999999;
            --pos: #48d597;
            --neg: #ff5555;
            --neu: #bbbbbb;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 12.5px;
        }

        #app {
            display: grid;
            grid-template-rows: 26px 1fr;
            height: 100vh;
            width: 100vw;
        }

        #status-bar {
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: #0a0d12;
            color: var(--soft);
            font-size: 11px;
            border-bottom: 1px solid var(--border);
            font-variant-numeric: tabular-nums;
        }

        #dash {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1.6fr) minmax(0, 1.2fr) minmax(0, 1.1fr) minmax(0, 0.8fr);
            gap: 6px;
            padding: 6px;
            box-sizing: border-box;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .dash-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .dash-panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            flex: 0 0 auto;
        }

        .dash-panel-dot {
            font-size: 14px;
            line-height: 1;
            color: var(--neu);
        }

        .dash-panel-chart {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }

        .dash-strat-rows {
            display: flex;
            flex-direction: column;
            padding: 6px 10px;
            gap: 4px;
            flex: 0 0 auto;
        }
        .dash-strat-row {
            display: grid;
            grid-template-columns: 1.4fr 1fr 0.8fr;
            align-items: baseline;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }
        .dash-strat-name { font-weight: 600; }
        .dash-strat-equity { color: var(--text); }
        .dash-strat-pct { font-weight: 600; text-align: right; }
        .dash-strat-spark { flex: 1 1 auto; min-height: 0; }

        .dash-status-list,
        .dash-trades-list {
            list-style: none;
            margin: 0;
            padding: 8px 12px;
            flex: 1 1 auto;
            overflow: auto;
            line-height: 1.5;
        }
        .dash-status-list li {
            padding: 2px 0;
            color: var(--text);
        }
        .dash-trades-list li {
            display: grid;
            grid-template-columns: 18px 64px 60px 1fr;
            gap: 6px;
            padding: 3px 0;
            font-variant-numeric: tabular-nums;
        }
        .dash-trade-mark { font-weight: 700; }
        .dash-trade-time { color: var(--soft); }
        .dash-trade-sym { color: var(--text); font-weight: 600; }
        .dash-trade-body { color: var(--soft); }

        #panel-candles { grid-row: 1; grid-column: 1; }
        #panel-gauge { grid-row: 1; grid-column: 2; }
        #panel-hawkes { grid-row: 2; grid-column: 1; }
        #panel-strategies { grid-row: 2; grid-column: 2; }
        #panel-multi { grid-row: 3; grid-column: 1; }
        #panel-trades { grid-row: 3; grid-column: 2; }
        #panel-status { grid-row: 4; grid-column: 1 / span 2; }
    </style>
</head>
<body>
    <div id="app">
        <div id="status-bar">starting…</div>
        <div id="dash">
            <div id="panel-candles" class="dash-panel"></div>
            <div id="panel-gauge" class="dash-panel"></div>
            <div id="panel-hawkes" class="dash-panel"></div>
            <div id="panel-strategies" class="dash-panel"></div>
            <div id="panel-multi" class="dash-panel"></div>
            <div id="panel-trades" class="dash-panel"></div>
            <div id="panel-status" class="dash-panel"></div>
        </div>
    </div>
    <script type="module" src="./src/app.ts"></script>
</body>
</html>
